<title>Queenstown Society</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: dark-spruce side rail + content column; hero is a banded stage of generated skyline art with a glass "Coming up" forecast panel. Phones get a bottom tab bar. */
:root{
  --bg:#EDF3F1; --surface:#FFFFFF; --surface-2:#F4F8F7; --ink:#0F2A2B; --ink-2:#506869; --line:#D8E3E0;
  --brand:#0F4C4A; --brand-ink:#FFFFFF; --accent:#E39A1B; --accent-ink:#2B1B00;
  --good:#1B8553; --warn:#B86E05; --bad:#C23B3B; --info:#2B6CB0;
  --side-bg:#0B3B3A; --side-ink:#E4F0EE; --side-ink2:#9FC2BE; --side-on:rgba(255,255,255,.12);
  --on-art:#FFFFFF; --on-art-2:rgba(255,255,255,.80); --glass:rgba(8,24,26,.52);
  --shadow:0 1px 2px rgba(15,42,43,.06),0 10px 28px rgba(15,42,43,.08);
  --f-display:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1516; --surface:#102123; --surface-2:#152B2D; --ink:#E6F0EE; --ink-2:#9DB4B2; --line:#223A3C;
  --brand:#3BB5AA; --brand-ink:#04201F; --accent:#F2B13A; --accent-ink:#2B1B00;
  --good:#4CC38A; --warn:#EBA43A; --bad:#EF7B7B; --info:#6FAEEB;
  --side-bg:#0D1F21; --side-ink:#E4F0EE; --side-ink2:#86A9A6; --side-on:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1516; --surface:#102123; --surface-2:#152B2D; --ink:#E6F0EE; --ink-2:#9DB4B2; --line:#223A3C;
  --brand:#3BB5AA; --brand-ink:#04201F; --accent:#F2B13A; --accent-ink:#2B1B00;
  --good:#4CC38A; --warn:#EBA43A; --bad:#EF7B7B; --info:#6FAEEB;
  --side-bg:#0D1F21; --side-ink:#E4F0EE; --side-ink2:#86A9A6; --side-on:rgba(255,255,255,.09);
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.28); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.012em}
p{margin:0} a{color:inherit} small{color:var(--ink-2)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:20px;height:20px;flex:none}
.muted{color:var(--ink-2)} .num{font-variant-numeric:tabular-nums}
.noscroll{overflow:hidden}

/* shell */
.shell{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;background:var(--side-bg);color:var(--side-ink);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none}
.brand svg{width:38px;height:38px;flex:none}
.brand b{font:700 19px/1 var(--f-display);display:block;letter-spacing:-.01em}
.brand span{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-ink2)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav h6{margin:10px 10px 4px;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--side-ink2);font-weight:700}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:11px;text-decoration:none;color:var(--side-ink);font-weight:600;font-size:14px;transition:background .2s,transform .2s}
.nav a:hover{background:var(--side-on);transform:translateX(2px)}
.nav a.on{background:var(--accent);color:var(--accent-ink)}
.nav .badge-n{margin-left:auto;background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;padding:1px 7px;font-weight:800}
.nav a.on .badge-n{background:var(--accent-ink);color:var(--accent)}
.side .me{margin-top:auto;display:flex;gap:10px;align-items:center;padding:10px;border-radius:13px;background:var(--side-on);text-decoration:none}
.me small{color:var(--side-ink2);display:block;font-size:12px}
.me b{font-size:13.5px}
.av{width:36px;height:36px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:800 14px var(--f-display);flex:none}
.main{min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:10px;height:62px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top .ttl{font:700 20px var(--f-display);flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .brand{display:none}
.iconbtn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;transition:transform .15s}
.iconbtn:hover{transform:translateY(-1px)}
.iconbtn .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font:800 10.5px/18px var(--f-body);text-align:center;padding:0 4px}
.wrap{max-width:1200px;margin:0 auto;padding-block:8px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:22px}
.view.enter>*{animation:rise .5s cubic-bezier(.2,.7,.2,1) both}
.view.enter>*:nth-child(2){animation-delay:.05s}.view.enter>*:nth-child(3){animation-delay:.1s}.view.enter>*:nth-child(4){animation-delay:.15s}.view.enter>*:nth-child(5){animation-delay:.2s}.view.enter>*:nth-child(n+6){animation-delay:.25s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.tabbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:50;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabbar a,.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border:0;background:none;text-decoration:none;color:var(--ink-2);font-size:11px;font-weight:700;border-radius:12px;cursor:pointer}
.tabbar .on{color:var(--brand)} .tabbar .on .ic{transform:translateY(-2px) scale(1.1)}
.tabbar .ic{transition:transform .2s}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr)} .side{display:none}
  .tabbar{display:flex} .top .brand{display:flex} .top .brand b{color:var(--ink);font-size:17px} .top .brand span{display:none}
  .top .ttl{display:none}.top .sp{flex:1}
}

/* primitives */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h3{font-size:17px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3 .more{margin-left:auto;font:700 12.5px var(--f-body);color:var(--brand);text-decoration:none}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}
@media (max-width:900px){.split{grid-template-columns:minmax(0,1fr)}}
.ph{display:flex;gap:14px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;padding-top:6px}
.ph h2{font-size:clamp(24px,3.4vw,32px)} .ph p{color:var(--ink-2);margin-top:4px;max-width:60ch}
.ph-act{display:flex;gap:8px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:14px;cursor:pointer;text-decoration:none;transition:transform .15s,box-shadow .15s,background .2s;position:relative;overflow:hidden;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)} .btn:active{transform:scale(.97)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.acc{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad);border-color:transparent}
.btn.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good);border-color:transparent}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 11px;font-size:13px;border-radius:10px}
.btn.armed{background:var(--bad);color:#fff}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn.block{width:100%}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:color-mix(in srgb,var(--ink-2) 14%,transparent);color:var(--ink-2);white-space:nowrap}
.chip.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.chip.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.chip.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.chip.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.chip.brand{background:color-mix(in srgb,var(--brand) 16%,transparent);color:var(--brand)}
.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:13px;cursor:pointer;transition:all .2s}
.pill.on{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.search{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0 12px;min-width:0;flex:1;max-width:340px}
.search input{border:0;background:none;outline:0;padding:10px 0;min-width:0;width:100%}
.empty{text-align:center;padding:36px 16px;color:var(--ink-2);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty .ic{width:34px;height:34px;color:var(--brand)} .empty b{color:var(--ink);font:700 17px var(--f-display)}
.row{display:flex;gap:12px;align-items:center;min-width:0}.row.wrap-r{flex-wrap:wrap}.sp{flex:1}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.hr{height:1px;background:var(--line);border:0;margin:6px 0;width:100%}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:color-mix(in srgb,var(--accent) 16%,var(--surface));border:1px dashed color-mix(in srgb,var(--accent) 60%,transparent);padding:10px 14px;border-radius:12px;font-size:13.5px}

/* forms */
.fld{display:flex;flex-direction:column;gap:5px;min-width:0}
.fld>span{font-size:12.5px;font-weight:700;color:var(--ink-2)}
.fld input,.fld select,.fld textarea{border:1px solid var(--line);background:var(--surface-2);border-radius:11px;padding:10px 12px;min-width:0;width:100%;transition:border-color .2s,box-shadow .2s}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 22%,transparent)}
.fld textarea{min-height:96px;resize:vertical}
.fld .hint{font-size:12px;color:var(--ink-2)}
.chk{display:flex;gap:9px;align-items:center;font-size:14px;font-weight:600}
.chk input{width:18px;height:18px;accent-color:var(--brand)}
.frm{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.frm .full{grid-column:1/-1}
@media (max-width:560px){.frm{grid-template-columns:minmax(0,1fr)}}
.err{color:var(--bad);font-size:13.5px;font-weight:600;min-height:0}

/* modal + toast */
#modal-root{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;padding:16px}
#modal-root.open{display:flex}
.scrim-m{position:absolute;inset:0;background:rgba(5,18,20,.6);backdrop-filter:blur(3px);animation:fade .2s both}
.modal{position:relative;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:20px;padding:22px;width:min(100%,520px);max-height:calc(100% - 8px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .28s cubic-bezier(.2,.8,.2,1) both}
.modal.wide{width:min(100%,760px)}
.modal h3{font-size:21px;margin-bottom:4px}
.modal .mh{display:flex;gap:10px;align-items:flex-start;margin-bottom:16px}
.modal .mh .x{margin-left:auto}
@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@media (max-width:640px){#modal-root{align-items:flex-end;padding:0}.modal{border-radius:22px 22px 0 0;width:100%;max-height:92%;padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}}
#toasts{position:fixed;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:120;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;padding:0 16px}
@media (max-width:900px){#toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.toast{background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:13px;font-weight:700;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:rise .3s both;display:flex;gap:8px;align-items:center;max-width:100%}
.toast.out{opacity:0;transition:opacity .3s}

/* hero */
.hero{position:relative;border-radius:24px;overflow:hidden;background:#0A1A1C;color:var(--on-art);isolation:isolate;box-shadow:var(--shadow)}
.stage{position:relative;min-height:440px}
.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .9s ease,visibility .9s}
.slide.on{opacity:1;visibility:visible;z-index:1}
.art-wrap{position:absolute;inset:0;overflow:hidden}
.art{width:100%;height:100%;object-fit:cover;display:block}
.slide.on .art-wrap{animation:kb 10s ease-out both}
@keyframes kb{from{transform:scale(1)}to{transform:scale(1.07)}}
.scrim{position:absolute;inset:0;background:linear-gradient(90deg,rgba(5,16,18,.84) 0%,rgba(5,16,18,.5) 48%,rgba(5,16,18,.05) 100%),linear-gradient(0deg,rgba(5,16,18,.7),transparent 45%)}
.slide-body{position:absolute;left:clamp(18px,3vw,38px);bottom:62px;right:clamp(18px,3vw,38px);max-width:640px;display:flex;flex-direction:column;gap:12px}
.slide.on .slide-body>*{animation:rise .8s cubic-bezier(.2,.7,.2,1) both}
.slide.on .slide-body>*:nth-child(2){animation-delay:.12s}.slide.on .slide-body>*:nth-child(3){animation-delay:.22s}.slide.on .slide-body>*:nth-child(4){animation-delay:.32s}.slide.on .slide-body>*:nth-child(5){animation-delay:.42s}
.tag{align-self:flex-start;background:var(--accent);color:var(--accent-ink);padding:4px 12px;border-radius:99px;font:800 11.5px var(--f-body);letter-spacing:.1em;text-transform:uppercase}
.tag.thr{background:rgba(255,255,255,.2);color:#fff;backdrop-filter:blur(6px)}
.slide h1{font-size:clamp(28px,4.6vw,52px);font-weight:800;color:var(--on-art);text-shadow:0 2px 24px rgba(0,0,0,.35)}
.slide .meta{color:var(--on-art-2);display:flex;gap:16px;flex-wrap:wrap;font-weight:600}
.slide .meta span{display:inline-flex;gap:6px;align-items:center}
.cd{display:flex;gap:8px}
.cd div{background:var(--glass);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.18);border-radius:12px;padding:6px 10px;min-width:56px;text-align:center}
.cd b{display:block;font:800 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.cd small{color:var(--on-art-2);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase}
.hero-ctl{position:absolute;left:clamp(18px,3vw,38px);bottom:22px;z-index:3;display:flex;align-items:center;gap:8px}
.dotb{width:34px;height:5px;border-radius:3px;background:rgba(255,255,255,.3);border:0;padding:0;cursor:pointer;position:relative;overflow:hidden}
.dotb.on::after{content:"";position:absolute;inset:0;background:var(--accent);transform-origin:left;animation:bar 6s linear both}
.hero.paused .dotb.on::after{animation-play-state:paused}
@keyframes bar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.arrow{width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;backdrop-filter:blur(6px)}
.arrow:hover{background:rgba(255,255,255,.22)}
.forecast{position:absolute;z-index:3;right:16px;top:16px;bottom:16px;width:292px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.16);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.forecast h4{font:700 12px var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--on-art-2);display:flex;align-items:center;gap:8px}
.forecast h4 .live{width:8px;height:8px;border-radius:50%;background:#58e0a0;animation:pulse 1.8s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(88,224,160,.6)}100%{box-shadow:0 0 0 10px rgba(88,224,160,0)}}
.fi{display:flex;gap:11px;align-items:center;padding:8px;border-radius:12px;text-decoration:none;color:var(--on-art);transition:background .2s}
.fi:hover{background:rgba(255,255,255,.1)}
.fi .d{width:44px;flex:none;text-align:center;border-radius:10px;background:rgba(255,255,255,.12);padding:4px 0}
.fi .d b{display:block;font:800 17px/1 var(--f-display)} .fi .d small{color:var(--on-art-2);font-size:10px;text-transform:uppercase;letter-spacing:.08em}
.fi .t{min-width:0;font-weight:700;font-size:13.5px;line-height:1.25}
.fi .t small{display:block;color:var(--on-art-2);font-weight:600;font-size:12px}
.fi .k{width:8px;height:8px;border-radius:50%;flex:none;margin-left:auto}
@media (max-width:980px){
  .forecast{position:relative;inset:auto;width:auto;margin:0 12px 12px;border-radius:16px}
  .stage{min-height:400px}.slide-body{bottom:58px}
}
.sway{animation:sway 4.5s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 0}
.tw{animation:tw 3.2s ease-in-out infinite}.rot{animation:spin 90s linear infinite}
@keyframes sway{from{transform:rotate(-4deg)}to{transform:rotate(4deg)}}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes spin{to{transform:rotate(360deg)}}

/* kpi */
.kpi{display:flex;gap:14px;align-items:center;padding:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;transition:transform .2s,box-shadow .2s;min-width:0}
.kpi:hover{transform:translateY(-3px);box-shadow:var(--shadow)}
.kpi .k-ic{width:44px;height:44px;border-radius:13px;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand);display:grid;place-items:center;flex:none}
.kpi.warn .k-ic{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.kpi.bad .k-ic{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.kpi b{font:800 24px/1.1 var(--f-display);display:block;font-variant-numeric:tabular-nums}
.kpi small{font-weight:600}

/* lists & cards */
.notice{display:flex;gap:14px;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);cursor:pointer;transition:transform .2s,border-color .2s;min-width:0}
.notice:hover{transform:translateX(3px);border-color:var(--brand)}
.notice.unread{border-left:4px solid var(--accent)}
.notice .ni{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}

const greet=()=>{const h=new Date().getHours();return h<12?'Good morning':h<17?'Good afternoon':'Good evening'};
const isoLocal=d=>{const x=new Date(d);x.setMinutes(x.getMinutes()-x.getTimezoneOffset());return x.toISOString().slice(0,16)};
function rng(seed){let a=seed>>>0;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const hashStr=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))|0;return Math.abs(h)};
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('qs|'+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){return'x'+btoa(unescape(encodeURIComponent('qs|'+s)))}}
function readImage(file,maxW=1200,q=.72){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=rej;fr.onload=()=>{const im=new Image();im.onerror=rej;im.onload=()=>{const k=Math.min(1,maxW/im.width),c=document.createElement('canvas');c.width=im.width*k;c.height=im.height*k;c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',q))};im.src=fr.result};fr.readAsDataURL(file)})}

function scene(kind='night',seed=1){
 const p=PAL[kind]||PAL.night,r=rng(seed*977+kind.length*13),W=1600,H=900,id='s'+Math.floor(r()*1e7),f=n=>n.toFixed(0);
 let s=`<svg class="art" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs><linearGradient id="${id}g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${p.sky[0]}"/><stop offset=".62" stop-color="${p.sky[1]}"/><stop offset="1" stop-color="${p.sky[2]}"/></linearGradient><radialGradient id="${id}r"><stop offset="0" stop-color="${p.glow}" stop-opacity=".9"/><stop offset="1" stop-color="${p.glow}" stop-opacity="0"/></radialGradient></defs><rect width="${W}" height="${H}" fill="url(#${id}g)"/>`;
 const sx=380+r()*900,sy=250+r()*110;
 s+=`<circle cx="${f(sx)}" cy="${f(sy)}" r="280" fill="url(#${id}r)"/>`;
 if(kind==='yoga'){s+=`<g class="rot" style="transform-origin:${f(sx)}px ${f(sy)}px">`;for(let i=0;i<28;i++){const a=i/28*Math.PI*2;s+=`<line x1="${f(sx+Math.cos(a)*76)}" y1="${f(sy+Math.sin(a)*76)}" x2="${f(sx+Math.cos(a)*(i%2?190:260))}" y2="${f(sy+Math.sin(a)*(i%2?190:260))}" stroke="${p.glow}" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>`}s+='</g>'}
 s+=`<circle cx="${f(sx)}" cy="${f(sy)}" r="52" fill="${p.glow}"/>`;
 if(['night','festival','meeting','kids'].includes(kind))for(let i=0;i<50;i++)s+=`<circle class="tw" style="animation-delay:${(r()*4).toFixed(1)}s" cx="${f(r()*W)}" cy="${f(r()*420)}" r="${(r()*1.7+.6).toFixed(1)}" fill="#fff"/>`;
 s+=`<path d="M0 650 Q320 520 640 630 T1260 600 T1600 650 V900 H0Z" fill="${p.far}"/>`;
 const tw=(x0,n,col,hmin,hmax,base,lit)=>{let o='',x=x0;for(let i=0;i<n;i++){const w=74+r()*54,h=hmin+r()*(hmax-hmin);o+=`<rect x="${f(x)}" y="${f(base-h)}" width="${f(w)}" height="${f(h)}" fill="${col}"/>`;if(lit)for(let yy=base-h+18;yy<base-16;yy+=24)for(let xx=x+10;xx<x+w-14;xx+=19)if(r()<.36)o+=`<rect x="${f(xx)}" y="${f(yy)}" width="8" height="12" rx="1" fill="#ffd27a" opacity="${(.4+r()*.55).toFixed(2)}"/>`;x+=w+10+r()*30}return o};
 s+=tw(-30,13,p.far,200,360,720,false)+tw(-10,12,p.near,260,520,800,true);
 s+=`<rect y="790" width="${W}" height="110" fill="${p.near}"/>`;
 if(p.lamp){s+=`<path d="M0 90 Q400 190 800 110 T1600 130" fill="none" stroke="#000" stroke-opacity=".35" stroke-width="3"/>`;for(let i=0;i<14;i++){const x=60+i*115,y=95+Math.sin(i*.55)*38+i*2.4,c=p.lamp[i%3];s+=`<g class="sway" style="animation-delay:${(i*.3).toFixed(1)}s"><line x1="${x}" y1="${f(y-6)}" x2="${x}" y2="${f(y+22)}" stroke="#000" stroke-opacity=".4"/><circle cx="${x}" cy="${f(y+40)}" r="30" fill="${c}" opacity=".28"/><ellipse cx="${x}" cy="${f(y+40)}" rx="14" ry="18" fill="${c}"/></g>`}}
 if(kind==='garden'||kind==='yoga'||kind==='sports')for(let i=0;i<9;i++){const x=40+i*190+r()*60,h=90+r()*80;s+=`<g class="sway" style="animation-delay:${(r()*3).toFixed(1)}s"><rect x="${f(x-6)}" y="${f(800-h)}" width="12" height="${f(h)}" fill="#07201c"/><circle cx="${f(x)}" cy="${f(800-h-34)}" r="${f(46+r()*20)}" fill="${i%2?'#1d6b4f':'#2f8a5f'}"/><circle cx="${f(x+28)}" cy="${f(800-h-10)}" r="40" fill="#1d6b4f"/></g>`}
 if(kind==='sports'){s+=`<path d="M0 840 L1600 840 L1600 900 L0 900Z" fill="#1f7a4a"/>`;for(let i=0;i<8;i++)s+=`<path d="M${i*200} 840 L${i*200+100} 840 L${i*200+60} 900 L${i*200-40} 900Z" fill="#2a9158" opacity=".7"/>`;s+=`<circle cx="${f(sx-120)}" cy="${f(sy+170)}" r="22" fill="#fff"/><path d="M${f(sx-420)} 640 Q${f(sx-250)} 360 ${f(sx-120)} ${f(sy+170)}" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="3" stroke-dasharray="10 12"/>`}
 if(kind==='kids')for(let i=0;i<8;i++){const x=120+i*190+r()*50,y=560+r()*120,c=p.lamp[i%3];s+=`<g class="sway" style="animation-delay:${(r()*3).toFixed(1)}s"><ellipse cx="${f(x)}" cy="${f(y)}" rx="34" ry="42" fill="${c}"/><path d="M${f(x)} ${f(y+42)} q-8 60 6 110" fill="none" stroke="#fff" stroke-opacity=".6"/></g>`}
 for(let i=0;i<16;i++){const x=i*105+r()*40;s+=`<circle cx="${f(x)}" cy="812" r="${f(24+r()*20)}" fill="${p.near}"/>`}
 return s+'</svg>';
}

/* ========== store ========== */
const KEY='qs_data_v1',SKEY='qs_session_v1',TKEY='qs_theme',AKEY='qs_token_v1';
/* Two modes. With no API address (config.js) the app runs on this browser only, using demo data.
   With an API address it talks to the Render server, which keeps everything in MongoDB. */
const API=String((typeof window!=='undefined'&&window.QS_API)||'').trim().replace(/\/+$/,'');
const REMOTE=!!API;
let DB=null,SES=null,TOKEN=null;
const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}};
const lsDel=k=>{try{localStorage.removeItem(k)}catch(e){}};
function loadDB(){try{const r=lsGet(KEY);DB=r?JSON.parse(r):null}catch(e){DB=null}try{SES=JSON.parse(lsGet(SKEY)||'null')}catch(e){SES=null}}
function setSes(s){SES=s;if(s)lsSet(SKEY,JSON.stringify(s));else lsDel(SKEY)}
const adminName=()=>REMOTE?(SES&&SES.username)||'admin':DB.settings.adminUser;

/* ----- remote mode: server calls and change syncing ----- */
const SYNC_COLLS=['users','notices','events','bills','schedule','amenities','bookings','complaints','ads','polls','docs','contacts','entries','visitors','notifs','log'];
let SNAP={},syncing=false,dirty=false,LASTREV=null,syncTimer=null,failStreak=0;
async function api(path,opt={}){
 const h={'Content-Type':'application/json'};if(TOKEN)h.Authorization='Bearer '+TOKEN;
 let r;try{r=await fetch(API+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined})}
 catch(e){const er=new Error('Cannot reach the server. Check your internet connection and try again.');er.net=true;throw er}
 let j={};try{j=await r.json()}catch(e){}
 if(!r.ok){const er=new Error(j.error||'Something went wrong. Try again.');er.status=r.status;throw er}
 return j}
const snapOf=db=>{const s={settings:{settings:JSON.stringify(db.settings)}};for(const c of SYNC_COLLS){s[c]={};for(const d of (db[c]||[]))if(d&&d.id)s[c][d.id]=JSON.stringify(d)}return s};
function adopt(db,rev){DB=db;for(const c of SYNC_COLLS)DB[c]=DB[c]||[];SNAP=snapOf(DB);LASTREV=rev==null?LASTREV:rev}
function save(){
 if(!REMOTE){if(!lsSet(KEY,JSON.stringify(DB)))toast('Browser storage is full or blocked. Changes will be lost on reload.');return}
 if(!TOKEN)return;dirty=true;clearTimeout(syncTimer);syncTimer=setTimeout(flush,250)}
async function flush(){
 if(syncing||!dirty||!TOKEN||!DB)return;
 syncing=true;dirty=false;const prev=SNAP;
 try{
  DB.log=DB.log||[];DB.log.forEach(l=>{if(!l.id)l.id=uid('l')});
  const cur=snapOf(DB),changes={};
  for(const c of ['settings',...SYNC_COLLS]){const a=cur[c]||{},b=prev[c]||{},up=[],rem=[];
   for(const id in a)if(a[id]!==b[id])up.push(c==='settings'?{...DB.settings,id:'settings'}:JSON.parse(a[id]));
   for(const id in b)if(!(id in a))rem.push(id);
   if(up.length||rem.length)changes[c]={upsert:up,remove:rem}}
  if(!Object.keys(changes).length)return;
  SNAP=cur;
  const r=await api('/api/sync',{method:'POST',body:{changes}});failStreak=0;
  const rej=(r.rejected||[]).filter(x=>x.coll!=='log');
  if(!dirty)adopt(r.db,r.rev);
  if(rej.length){toast(rej[0].err||'Some changes could not be saved.','x');render()}
 }catch(e){
  if(e.status===401){syncing=false;return endSession('Your session ended. Please sign in again.')}
  SNAP=prev;dirty=true;if(!failStreak++)toast(e.net?'You are offline. Changes will save when you reconnect.':e.message,'x');
  setTimeout(flush,Math.min(30000,4000*failStreak))
 }finally{syncing=false;if(dirty&&!failStreak)flush()}}
function endSession(msg){TOKEN=null;lsDel(AKEY);setSes(null);UI.auth='login';location.hash='';loadPublic().finally(()=>{render(true);if(msg)toast(msg,'info')})}
async function loadPublic(){try{const r=await api('/api/public');adopt(r.db,r.rev)}catch(e){if(!DB)DB={v:1,settings:{name:'Queenstown Society',tagline:'Home, together.'}}; for(const c of SYNC_COLLS)DB[c]=DB[c]||[]}}
async function openSession(token,session){TOKEN=token;lsSet(AKEY,token);setSes(session);const r=await api('/api/state');adopt(r.db,r.rev);SES=r.session;setSes(SES)}
async function startRemote(){
 $('#app').innerHTML='<div class="boot" role="status"><div class="spin"></div><b>Connecting to Queenstown</b><small id="bootnote"></small></div>';
 const t=setTimeout(()=>{const n=$('#bootnote');if(n)n.textContent='The server is waking up. The first load can take up to a minute.'},4000);
 try{
  TOKEN=lsGet(AKEY);try{SES=JSON.parse(lsGet(SKEY)||'null')}catch(e){SES=null}
  if(TOKEN){try{const r=await api('/api/state');adopt(r.db,r.rev);SES=r.session;setSes(SES)}catch(e){if(e.status!==401)throw e;TOKEN=null;lsDel(AKEY);setSes(null)}}
  if(!TOKEN){SES=null;const r=await api('/api/public');adopt(r.db,r.rev)}
  return true
 }catch(e){
  $('#app').innerHTML=`<div class="boot"><b>Cannot reach the Queenstown server</b><small>${esc(e.message)}</small><button class="btn pri" data-act="retry-boot">Try again</button></div>`;return false
 }finally{clearTimeout(t)}}
async function pollRemote(){
 if(!REMOTE||!TOKEN||document.hidden||syncing||dirty||!DB)return;
 if($('#modal-root')?.classList.contains('open'))return;
 const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return;
 try{const r=await api('/api/rev');if(r.rev===LASTREV)return;const s=await api('/api/state');if(dirty||syncing)return;adopt(s.db,s.rev);SES=s.session;render()}
 catch(e){if(e.status===401)endSession('Your session ended. Please sign in again.')}}
if(typeof document!=='undefined'){setInterval(()=>pollRemote(),20000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollRemote()})}
const me=()=>!SES?null:SES.k==='admin'?{id:'admin',name:'Society Admin',role:'admin',status:'approved'}:DB.users.find(u=>u.id===SES.id)||null;
const isAdmin=()=>SES?.k==='admin';
const flatKey=u=>u.tower+'-'+u.flat;
function notify(to,text,link){DB.notifs.unshift({id:uid('n'),to,text,link:link||'',at:Date.now(),read:[]});DB.notifs=DB.notifs.slice(0,200)}
function logAct(t){DB.log.unshift({t,at:Date.now()});DB.log=DB.log.slice(0,60)}
const myNotifs=()=>{const m=me();return m?DB.notifs.filter(n=>isAdmin()?(n.to==='admin'||n.to==='all'):(n.to===m.id||n.to==='all')):[]};
const unreadN=()=>{const m=me();return myNotifs().filter(n=>!n.read.includes(m.id)).length};

/* money */
const chargeTotal=()=>DB.settings.charges.reduce((a,c)=>a+Number(c.amt||0),0);
function lateFee(b){if(b.status==='paid')return b.lateFee||0;return daysTo(b.dueDate)<0?Math.round(b.amount*DB.settings.latePct/100):0}
const billTotal=b=>b.amount+lateFee(b);
const billsOf=fk=>DB.bills.filter(b=>b.flat===fk).sort((a,b)=>b.month.localeCompare(a.month));
const unpaidOf=fk=>billsOf(fk).filter(b=>b.status!=='paid');
function collection(m){const bs=DB.bills.filter(b=>b.month===m),paid=bs.filter(b=>b.status==='paid');return{total:bs.length,paid:paid.length,ver:bs.filter(b=>b.status==='verifying').length,billed:bs.reduce((a,b)=>a+b.amount,0),got:paid.reduce((a,b)=>a+billTotal(b),0),pct:bs.length?Math.round(paid.length/bs.length*100):0}}
const approvedFlats=()=>{const m=new Map();DB.users.filter(u=>u.status==='approved').forEach(u=>{const k=flatKey(u);if(!m.has(k)||u.type==='Owner')m.set(k,u)});return[...m.values()]};

function closeModal(){const r=$('#modal-root');r.classList.remove('open');r.innerHTML='';document.body.classList.remove('noscroll')}
function toast(msg,icon='check'){const t=document.createElement('div');t.className='toast';t.innerHTML=ic(icon)+esc(msg);$('#toasts').appendChild(t);setTimeout(()=>t.classList.add('out'),2800);setTimeout(()=>t.remove(),3200)}
function confetti(){const c=document.createElement('div');c.className='confetti';const cols=['#E39A1B','#2FA39B','#C23B3B','#2B6CB0','#F2B13A','#fff'];for(let i=0;i<60;i++){const e=document.createElement('i');e.style.cssText=`left:${Math.random()*100}%;background:${cols[i%6]};--x:${(Math.random()-.5)*260}px;--r:${Math.random()*720}deg;animation-delay:${Math.random()*.4}s;animation-duration:${1.4+Math.random()*1.2}s`;c.appendChild(e)}document.body.appendChild(c);setTimeout(()=>c.remove(),3200)}
function copyText(t){const done=()=>toast('Copied');try{navigator.clipboard.writeText(t).then(done,()=>fallback())}catch(e){fallback()}function fallback(){const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();try{document.execCommand('copy');done()}catch(e){toast('Select the text and copy it manually','info')}a.remove()}}

function heroSlides(){const now=Date.now(),f=DB.events.filter(e=>e.featured);return[...f.filter(e=>+D(e.date)>=now-3*3600e3).sort((a,b)=>D(a.date)-D(b.date)).slice(0,4).map(e=>({e,tag:'Upcoming'})),...f.filter(e=>+D(e.date)<now-3*3600e3).sort((a,b)=>D(b.date)-D(a.date)).slice(0,1).map(e=>({e,tag:'Throwback'}))]}
function hero(pub=false){
 const sl=heroSlides();if(!sl.length)return'';
 const items=forecastItems(sod(new Date()),new Date(Date.now()+30*DAY),{publicOnly:pub}).filter(x=>!pub||x.kind==='event'||x.kind==='meeting').slice(0,5);
 return`<section class="hero" aria-label="Society highlights" data-hero><div class="stage">${sl.map((s,i)=>{const e=s.e,up=s.tag==='Upcoming';return`<article class="slide ${i?'':'on'}" data-i="${i}"><div class="art-wrap">${cover(e)}</div><div class="scrim"></div><div class="slide-body"><span class="tag ${up?'':'thr'}">${up?'Upcoming · '+rel(e.date):'Throwback'}</span><h1>${esc(e.title)}</h1><div class="meta"><span>${ic('calendar')}${fwd(e.date)}, ${ftime(e.date)}</span><span>${ic('mappin')}${esc(e.venue)}</span></div>${up?`<div class="cd" data-cd="${e.date}"></div>`:`<p class="meta">${esc(e.desc)}</p>`}${pub?'':`<div class="row wrap-r">${up?btn(e.rsvps[me()?.id]?'You are '+(e.rsvps[me()?.id]==='yes'?'going':'interested'):'RSVP now','event-open',{c:'acc',d:{id:e.id}}):btn('See photos','nav',{c:'acc',d:{to:'gallery'}})}</div>`}</div></article>`}).join('')}
 <div class="hero-ctl"><button class="arrow" data-act="hero-prev" aria-label="Previous">${ic('cl')}</button>${sl.map((_,i)=>`<button class="dotb ${i?'':'on'}" data-act="hero-go" data-i="${i}" aria-label="Slide ${i+1}"></button>`).join('')}<button class="arrow" data-act="hero-next" aria-label="Next">${ic('cr')}</button></div></div>
 <aside class="forecast" aria-label="Coming up"><h4><span class="live"></span>Coming up · next 30 days</h4>${items.length?items.map(x=>`<a class="fi" href="${pub?'#':'#'+x.link}" ${pub?'data-act="noop"':''}><div class="d"><b>${D(x.at).getDate()}</b><small>${fdate(x.at,{month:'short'})}</small></div><div class="t">${esc(x.title)}<small>${rel(x.at)}${x.sub?' · '+esc(x.sub):''}</small></div><span class="k" style="background:${KIND[x.kind][1]}"></span></a>`).join(''):'<small style="color:var(--on-art-2)">Nothing scheduled in the next 30 days.</small>'}</aside></section>`;
}
let heroT=null,heroI=0;
function heroGo(i){const h=$('[data-hero]');if(!h)return;const sl=$$('.slide',h),ds=$$('.dotb',h);heroI=(i+sl.length)%sl.length;sl.forEach((s,k)=>s.classList.toggle('on',k===heroI));ds.forEach((d,k)=>{d.classList.remove('on');void d.offsetWidth;d.classList.toggle('on',k===heroI)});heroSched()}
function heroSched(){clearTimeout(heroT);const h=$('[data-hero]');if(!h||h.classList.contains('paused'))return;heroT=setTimeout(()=>heroGo(heroI+1),6000)}
function initHero(){clearTimeout(heroT);heroI=0;const h=$('[data-hero]');if(!h)return;h.onmouseenter=()=>{h.classList.add('paused');clearTimeout(heroT)};h.onmouseleave=()=>{h.classList.remove('paused');heroGo(heroI)};let x0=null;h.ontouchstart=e=>{x0=e.touches[0].clientX};h.ontouchend=e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;if(Math.abs(dx)>40)heroGo(heroI+(dx<0?1:-1));x0=null};heroSched()}
ACT['hero-go']=d=>heroGo(+d.i);ACT['hero-next']=()=>heroGo(heroI+1);ACT['hero-prev']=()=>heroGo(heroI-1);
function tickCd(){$$('[data-cd]').forEach(el=>{let s=Math.max(0,Math.floor((+D(el.dataset.cd)-Date.now())/1000));const d=Math.floor(s/86400);s%=86400;const h=Math.floor(s/3600);s%=3600;const m=Math.floor(s/60);el.innerHTML=[[d,'days'],[h,'hrs'],[m,'min'],[s%60,'sec']].map(([v,l])=>`<div><b>${String(v).padStart(2,'0')}</b><small>${l}</small></div>`).join('')})}
setInterval(tickCd,1000);

function countUp(){const red=matchMedia('(prefers-reduced-motion:reduce)').matches;$$('[data-count]').forEach(el=>{const to=+el.dataset.count,suf=el.dataset.suf||'',t0=performance.now();if(red||!to){el.textContent=to+suf;return}const step=t=>{const k=Math.min(1,(t-t0)/900),v=Math.round(to*(1-Math.pow(1-k,3)));el.textContent=v.toLocaleString('en-IN')+suf;if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}
function render(nav=false){
 if(!DB)return;applyTheme();const root=$('#app'),y=scrollY,ae=document.activeElement,aid=ae&&ae.id&&root.contains(ae)?ae.id:null,pos=aid&&ae.selectionStart!=null?ae.selectionStart:null;

 root.innerHTML=html;if(PV)root.insertAdjacentHTML('beforeend',pvBar());document.title=(route&&route!=='home'?($('.top .ttl')?.textContent+' · '):'')+DB.settings.name;

 if(aid){const el=document.getElementById(aid);if(el){el.focus();try{if(pos!=null)el.setSelectionRange(pos,pos)}catch(e){}}}
 initHero();tickCd();countUp();
}

/* Online payment with Razorpay Checkout. The server prices the order and confirms the payment; this only opens the window. */
function rzpLoad(){return window.Razorpay?Promise.resolve():new Promise((res,rej)=>{const sc=document.createElement('script');sc.src='https://checkout.razorpay.com/v1/checkout.js';sc.onload=res;sc.onerror=()=>rej(new Error('Could not open the payment window. Check your internet connection and try again.'));document.head.appendChild(sc)})}
ACT['rzp-pay']=async d=>{
 const btn=$('#rzpbtn'),label=btn?btn.innerHTML:'',reset=()=>{if(btn){btn.disabled=false;btn.innerHTML=label}};
 if(btn){btn.disabled=true;btn.textContent='Starting payment...'}
 try{
  if(dirty||syncing)await flush();
  const o=await api('/api/payments/order',{method:'POST',body:{billIds:d.ids.split(',')}});
  await rzpLoad();
  const rz=new window.Razorpay({key:o.keyId,amount:o.amount,currency:o.currency,name:o.name,description:o.description,order_id:o.orderId,prefill:o.prefill,theme:{color:'#0B3B3A'},
   modal:{ondismiss:reset,confirm_close:true},
   handler:async resp=>{
    if(btn)btn.textContent='Confirming payment...';
    try{const r=await api('/api/payments/verify',{method:'POST',body:{orderId:resp.razorpay_order_id,paymentId:resp.razorpay_payment_id,signature:resp.razorpay_signature}});adopt(r.db,r.rev);closeModal();render();confetti();toast('Payment received. Your receipt is ready.')}
    catch(e){closeModal();toast('We are confirming your payment. It will show here shortly.','info');setTimeout(pollRemote,5000);setTimeout(pollRemote,20000)}}});
  rz.on('payment.failed',r=>{toast((r.error&&r.error.description)||'The payment failed. Try again.','x');reset()});
  rz.open();
 }catch(e){reset();toast(e.message,'x')}};

const BAD_KEY=k=>k==='__proto__'||k==='constructor'||k==='prototype';
function deepMerge(d,s){

 const id=site.theme.festival,f=FEST.find(x=>x.id===id);

const prand=(i,m)=>((i*9301+49297+i*i*131)%233280)/233280*m;
function applyFx(def,on){

 if(!def||!def.fx||!on){if(el)el.remove();return}

function loadImg(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onerror=()=>rej(new Error('That file could not be read.'));fr.onload=()=>{const im=new Image();im.onerror=()=>rej(new Error('That image could not be opened. Try a PNG or JPEG.'));im.onload=()=>res(im);im.src=fr.result};fr.readAsDataURL(file)})}
async function fitImage(file,{max,alpha,cap}){
 const im=await loadImg(file),w0=im.naturalWidth||im.width||max,h0=im.naturalHeight||im.height||max;
 let k=Math.min(1,max/Math.max(w0,h0));
 for(let i=0;i<8;i++){
  const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w0*k));c.height=Math.max(1,Math.round(h0*k));
  const x=c.getContext('2d');if(!alpha){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}
  x.drawImage(im,0,0,c.width,c.height);
  let url;if(alpha){url=c.toDataURL('image/webp',.9);if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/png')}else url=c.toDataURL('image/jpeg',Math.max(.5,.84-i*.06));
  if(url.length<=cap)return url;k*=.8}
 throw new Error('That image is too detailed to store. Try a smaller or simpler one.')}

FORMS.adminpw=async d=>{if(REMOTE){if(d.ap_new.length<8)return fErr('New password needs at least 8 characters.');try{const r=await api('/api/auth/password',{method:'POST',body:{current:d.ap_old,next:d.ap_new,username:d.ap_user}});TOKEN=r.token;lsSet(AKEY,TOKEN);SES={...SES,username:d.ap_user.trim().toLowerCase()};setSes(SES);render();toast('Admin login updated')}catch(e){fErr(e.message)}return}if(await sha(d.ap_old)!==DB.settings.adminHash)return fErr('Current password is incorrect.');if(d.ap_new.length<8)return fErr('New password needs at least 8 characters.');DB.settings.adminUser=d.ap_user.trim();DB.settings.adminHash=await sha(d.ap_new);save();render();toast('Admin login updated')};

ACT.restore=()=>modal('Restore backup',formWrap('restore',`<label class="fld full"><span>Paste backup text</span><textarea id="rs" name="rs" required style="min-height:200px"></textarea></label>`,'Restore'));
FORMS.restore=d=>{try{const x=JSON.parse(d.rs);if(!x.settings||!x.users)throw 0;DB=x;save();closeModal();render(true);toast('Backup restored')}catch(e){fErr('That text is not a valid backup.')}};
ACT['reset-demo']=async()=>{DB=await seed();save();setSes({k:'admin'});render(true);toast('Demo data reloaded')};
ACT['clear-demo']=async()=>{const s=DB.settings,am=DB.amenities,co=DB.contacts.filter(c=>c.cat==='Emergency');DB={v:1,settings:{...s,demo:false,upi:s.upi.includes('queenstown.society@upi')?'':s.upi},users:[],notices:[],events:[],bills:[],schedule:[],amenities:am,bookings:[],complaints:[],ads:[],polls:[],docs:[],contacts:co,entries:[],visitors:[],notifs:[],log:[{t:'Demo data cleared. Society is live.',at:Date.now()}]};save();render(true);toast('Demo data cleared. Add your UPI ID in Society setup.','info')};

/* ----- global actions ----- */
ACT.theme=()=>{const r=document.documentElement,dark=r.dataset.theme==='dark'||(!r.dataset.theme&&matchMedia('(prefers-color-scheme:dark)').matches),n=dark?'light':'dark';r.dataset.theme=n;lsSet(TKEY,n);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=n==='dark'?'#0A1516':'#0B3B3A';render()};
ACT.logout=()=>{closeModal();if(REMOTE){endSession();return}setSes(null);UI.auth='login';location.hash='';render(true)};
ACT['close-modal']=()=>closeModal();
ACT.bell=()=>{const m=me(),l=myNotifs().slice(0,30);l.forEach(n=>{if(!n.read.includes(m.id))n.read.push(m.id)});save();modal('Notifications',l.length?`<div class="stack">${l.map(n=>`<a class="notice" style="text-decoration:none;cursor:pointer" href="#${n.link||'home'}" data-act="close-modal"><div class="ni">${ic('bell')}</div><div class="sp" style="min-width:0"><b>${esc(n.text)}</b><div class="meta"><span>${rel(n.at)}</span></div></div></a>`).join('')}</div>`:empty('bell','You are all caught up'));render()};

document.addEventListener('click',e=>{
 const b=e.target.closest('.btn');if(b&&!b.disabled&&!matchMedia('(prefers-reduced-motion:reduce)').matches){const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height),sp=document.createElement('span');sp.className='ripple';sp.style.cssText=`width:${s}px;height:${s}px;left:${e.clientX-r.left-s/2}px;top:${e.clientY-r.top-s/2}px`;b.appendChild(sp);setTimeout(()=>sp.remove(),600)}
 const t=e.target.closest('[data-act]');if(!t)return;const a=t.dataset.act;
 if(t.dataset.confirm&&!t.classList.contains('armed')){e.preventDefault();e.stopPropagation();t.classList.add('armed');t.dataset.label=t.innerHTML;t.innerHTML='Tap again to confirm';setTimeout(()=>{if(t.isConnected&&t.dataset.label){t.classList.remove('armed');t.innerHTML=t.dataset.label}},3000);return}
 if(a==='nav'||t.tagName==='A'&&a==='close-modal'){}
 if(ACT[a]){if(t.tagName==='A'&&a!=='close-modal'&&a!=='noop')e.preventDefault();ACT[a](t.dataset,t,e)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-act][tabindex="0"]')){e.preventDefault();e.target.click()}});
document.addEventListener('submit',async e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const h=FORMS[f.dataset.form];if(!h)return;const d=Object.fromEntries(new FormData(f));const sb=f.querySelector('[type=submit]');if(sb)sb.disabled=true;try{await h(d,f)}finally{if(sb&&sb.isConnected)sb.disabled=false}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset&&t.dataset.input){UI[t.dataset.input]=t.value;render()}});

/* ----- boot ----- */
(async function boot(){
 try{const th=lsGet(TKEY);if(th)document.documentElement.dataset.theme=th}catch(e){}
 if(REMOTE){if(!(await startRemote()))return}
 else{loadDB();if(!DB||!DB.settings){DB=await seed();save()}
 DB.entries=DB.entries||[];DB.visitors=DB.visitors||[];DB.notifs=DB.notifs||[];DB.log=DB.log||[];
 if(SES&&SES.k==='user'&&!DB.users.some(u=>u.id===SES.id))SES=null}
 render(true);
 if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

ACT['reset-pw']=d=>{const u=DB.users.find(x=>x.id===d.id);modal('Reset password for '+esc(u.name),`<div class="stack"><p>This signs ${esc(u.name)} out everywhere and creates a temporary password. Share it with the resident in person or on a call. They can change it under Profile.</p><div class="row" style="justify-content:flex-end">${btn('Cancel','close-modal')}${btn('Create temporary password','reset-pw-go',{c:'pri',d:{id:u.id}})}</div></div>`)};
ACT['reset-pw-go']=async d=>{const u=DB.users.find(x=>x.id===d.id);try{const r=await api('/api/admin/users/'+encodeURIComponent(d.id)+'/password',{method:'POST'});modal('Temporary password',`<div class="stack"><p>Give this to <b>${esc(u.name)}</b> (${esc(flatKey(u))}). It is shown only once.</p><div class="card flat" style="text-align:center;font:700 26px/1.2 monospace;letter-spacing:.06em;user-select:all">${esc(r.password)}</div><div class="row" style="justify-content:flex-end">${btn('Copy','copy',{c:'pri',i:'copy',d:{t:r.password}})}${btn('Done','close-modal')}</div></div>`);logAct('Reset password for '+u.name);save()}catch(e){toast(e.message,'x')}};</script>
